name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# D-007(a): without this, GITHUB_TOKEN inherits the repository default, which some org settings leave at
# read-write. This workflow only ever reads the repo and uploads artifacts, so read is enough.
permissions:
  contents: read

jobs:
  build:
    # Windows, Linux and macOS are first-class targets per the spec. Running all three is what turns that
    # from a claim into a fact -- the storage layer is the part most likely to diverge, and it is exactly
    # the part a single-platform run would never catch.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      # D-007(b): tags are movable, so a compromised action repo that moves its vN tag would have this
      # workflow run the new code on the next push/PR without any change here. Pinned to each action's
      # latest v4.x release SHA (verified against GitHub's API at pinning time, not guessed) rather than a
      # newer major -- actions/checkout, actions/setup-dotnet and actions/upload-artifact have all moved on
      # to v6/v7, but jumping majors is a separate, deliberate upgrade decision, not something that belongs
      # bundled into a supply-chain hardening pass.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: |
            10.0.x
            11.0.x
          dotnet-quality: preview

      - name: Restore
        run: dotnet restore Blun.MultiRaft.slnx

      - name: Build
        run: dotnet build Blun.MultiRaft.slnx --no-restore -c Release

      - name: Test (net10.0)
        # Not `dotnet test`: this project's Microsoft.Testing.Platform / xUnit v3 setup only runs through the
        # new MTP runner, and `dotnet test`'s VSTest bridge is refused outright on the .NET 10+ SDK ("Testing
        # with VSTest target is no longer supported"). Verified locally, not assumed -- `dotnet test` with
        # this exact invocation fails immediately, before a single test runs. `dotnet exec` on the built DLL
        # goes straight to the MTP entry point and takes MTP's own `-result-trx` flag instead.
        run: dotnet exec test/Blun.MultiRaft.Tests/bin/Release/net10.0/Blun.MultiRaft.Tests.dll -result-trx TestResults/net10.trx

      - name: Test (net11.0)
        # D-002: net11.0 carries runtime-async=on, an experimental switch that changes how async methods
        # execute -- exactly the behavior this library's async-heavy core depends on, and until now it ran
        # unverified on every platform. Same MTP invocation, the other target's build output.
        run: dotnet exec test/Blun.MultiRaft.Tests/bin/Release/net11.0/Blun.MultiRaft.Tests.dll -result-trx TestResults/net11.trx

      # NativeAOT on Linux shells out to clang and links against zlib. Both are present on the current
      # GitHub-hosted Ubuntu image, but that is an image detail rather than a promise, and its absence shows
      # up as a link error at the very end of a two-minute ILC run. Windows uses the VS C++ toolchain and
      # macOS the Xcode command line tools, both of which the hosted images do guarantee.
      - name: Install NativeAOT prerequisites (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      # IsAotCompatible on the libraries only enables Roslyn analyzers. They read that assembly's own IL, so
      # they cannot see a dependency that starts reflecting in a later version, and they never prove the
      # binary runs. This step is the part that does, in two stages: ILC fails the publish on any trim/AOT
      # warning, and the probe binary then exercises the log -- append, flush, both truncations, reopen with
      # the recovery scan and checksum verification -- asserting on what it reads back, across every checksum
      # algorithm and both segment access modes. A wrong answer exits non-zero.
      #
      # Both target frameworks, for the same reason D-002 runs the test suite twice: net11.0 carries
      # runtime-async=on, which changes how async methods are compiled, and "runtime-async under NativeAOT"
      # is a combination nothing else in this repo covers.
      #
      # No -r: with PublishAot the SDK infers the host RID, which is what keeps this correct on all three
      # runners, arm64 macOS included.
      - name: AOT probe
        shell: bash
        run: |
          set -euo pipefail
          for tfm in net10.0 net11.0; do
            out="artifacts/aot/$tfm"
            echo "::group::AOT publish $tfm"
            dotnet publish test/Blun.MultiRaft.AotProbe/Blun.MultiRaft.AotProbe.csproj -c Release -f "$tfm" -o "$out"
            echo "::endgroup::"
            if [ -f "$out/Blun.MultiRaft.AotProbe.exe" ]; then
              "$out/Blun.MultiRaft.AotProbe.exe"
            else
              "$out/Blun.MultiRaft.AotProbe"
            fi
          done

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-results-${{ matrix.os }}
          path: '**/TestResults/*.trx'
          if-no-files-found: ignore
