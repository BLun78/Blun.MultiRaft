syntax = "proto3";

option csharp_namespace = "Blun.MultiRaft.Grpc.Protocol";

package blun.multiraft;

// One bidirectional stream carries every group between a pair of nodes.
//
// This is the whole point of the design. A stream per Raft group would give each of thousands of groups its
// own HTTP/2 flow-control window and HPACK state, and would make batching across groups impossible. Instead
// the group id travels in the frame, requests and responses share the stream, and a correlation id pairs
// them up.
service RaftProtocol {
  rpc Session(stream RaftFrame) returns (stream RaftFrame);
}

message RaftFrame {
  // Pairs a response with its request. Unique per stream and per direction.
  uint64 correlation_id = 1;

  // Which Raft group this frame belongs to. Present on every frame -- it is what multiplexing means here.
  // RaftGroupId.Cluster (ulong.MaxValue internally) is remapped to 0 on the wire by RaftGroupWireId --
  // a varint with every bit set costs 10 bytes, and this field rides every frame the cluster group sends.
  // See RaftGroupWireId for the mapping; RaftGroupId itself is untouched.
  uint64 group_id = 2;

  // Field numbers 3-15 cost a 1-byte tag; 16+ costs 2 bytes (protobuf varint tag encoding). No wire
  // compatibility is promised for this protocol, so slots are assigned by expected traffic share, not
  // insertion order: AppendEntries/Reply and ReadIndex/Reply dominate steady-state traffic, LeaderTarget
  // and its reply are the rarest (cluster rebalancing only) and are the ones left paying 2 bytes.
  oneof payload {
    AppendEntries append_entries = 3;
    AppendEntriesReply append_entries_reply = 4;
    ReadIndex read_index = 5;
    ReadIndexReply read_index_reply = 6;
    NodeLoad node_load = 7;
    NodeLoadReply node_load_reply = 8;
    Vote vote = 9;
    VoteReply vote_reply = 10;
    TimeoutNow timeout_now = 11;
    TimeoutNowReply timeout_now_reply = 12;
    InstallSnapshot install_snapshot = 13;
    SnapshotChunk snapshot_chunk = 14;
    InstallSnapshotReply install_snapshot_reply = 15;
    LeaderTarget leader_target = 16;
    LeaderTargetReply leader_target_reply = 17;
  }
}

message LogEntry {
  int64 term = 1;
  int64 index = 2;
  int64 timestamp_ticks = 3;
  uint32 kind = 4;
  bytes payload = 5;

  // Opaque, application-defined tag (e.g. a Blun.MQ priority bucket 0-9). Carried in the WAL header itself
  // so a rebuild of a priority index at leader-takeover or restart can read RaftEntryHeader.Size bytes per
  // entry instead of the whole record -- see IRaftWal.ReadHeadersFromAsync. Must round-trip over the wire or
  // a follower's own rebuild would silently disagree with the leader's.
  uint32 application_tag = 6;

  // How `payload` is encoded (RaftPayloadCompression). Must round-trip: the follower stores these bytes
  // verbatim and only expands them when it applies the entry, so an omitted flag would have it hand a
  // compressed block to its state machine as if it were the command. The failure is silent in exactly the
  // way RaftFrameCodec's own remarks describe -- term, index and checksum all agree, only the contents are
  // wrong -- and invisible to any test on InMemoryRaftTransport, which copies the header by value.
  uint32 compression = 7;
}

message AppendEntries {
  int64 term = 1;
  uint64 leader = 2;
  int64 prev_log_index = 3;
  int64 prev_log_term = 4;
  int64 leader_commit = 5;

  // Carried in one frame rather than as a stream of frames: a replication round is already bounded by
  // MaxEntriesPerAppend and by the message size cap, and one frame means one write.
  repeated LogEntry entries = 6;
}

message AppendEntriesReply {
  int64 term = 1;
  bool success = 2;
  int64 match_index = 3;
  int64 conflict_index = 4;
}

message Vote {
  int64 term = 1;
  uint64 candidate = 2;
  int64 last_log_index = 3;
  int64 last_log_term = 4;
  bool pre_vote = 5;
}

message VoteReply {
  int64 term = 1;
  bool granted = 2;
}

// A snapshot body is unbounded, so unlike entries it really does stream: this frame opens the transfer and
// SnapshotChunk frames sharing the correlation id carry the body.
message InstallSnapshot {
  int64 term = 1;
  uint64 leader = 2;
  int64 last_included_index = 3;
  int64 last_included_term = 4;
  bytes configuration = 5;
}

message SnapshotChunk {
  bytes data = 1;
  bool last = 2;
}

message InstallSnapshotReply {
  int64 term = 1;
  bool success = 2;
}

// A leadership-confirming read barrier. Carries no log data at all -- that is the whole point.
message ReadIndex {
  int64 term = 1;
}

message ReadIndexReply {
  int64 term = 1;
  bool success = 2;
  int64 read_index = 3;
  uint64 leader = 4;
}

// Raft 3.10 leadership transfer: tells the receiver to start an election immediately, skipping its timer.
message TimeoutNow {
  int64 term = 1;
}

message TimeoutNowReply {
  int64 term = 1;
  bool accepted = 2;
}

// One node's load, pushed to whoever leads the cluster group. Soft state: never replicated, never logged,
// aged out when a node goes quiet. It rides the cluster group's frames because that is where it belongs, not
// because it has anything to do with that group's log.
message NodeLoad {
  uint64 node = 1;
  int64 sequence = 2;
  int32 group_count = 3;
  int32 leader_count = 4;
}

// Empty on purpose. The report is advisory and a lost one costs nothing, so there is nothing to say back --
// but it still gets a reply frame, because the session pairs every request with one.
message NodeLoadReply {
}

// Asks a group's leader whether a node could take over, and optionally tells it to hand over. The group id
// is already on the frame. Only that group's leader can answer: the judgement rests on per-peer match
// indices, and no other replica has them.
message LeaderTarget {
  // proto3 message fields carry presence natively, and node id 0 is a legal id -- `optional` (proto3
  // presence tracking) replaces a separate has_candidate bool. Clear means "you choose".
  optional uint64 candidate = 1;
  bool execute = 2;
}

message LeaderTargetReply {
  uint64 node = 1;
  uint32 status = 2;
  int64 lag = 3;
  bool transferred = 4;
}
